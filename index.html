<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Decision Playground</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #fff;
      --border: #dfe3e8;
      --border-strong: #c8ced6;
      --text: #20252b;
      --muted: #6b7280;
      --accent: #2667df;
      --accent-soft: #eef4ff;
      --danger: #b42318;
      --shadow: 0 2px 8px rgba(28, 38, 52, .04);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    button, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .app-shell {
      width: min(1440px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .app-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 2.3vw, 26px);
      line-height: 1.25;
      letter-spacing: -.02em;
    }

    .header-note {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      white-space: nowrap;
      padding-top: 4px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, .92fr);
      gap: 16px;
      align-items: stretch;
      flex: 1;
      min-height: 0;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .editor-panel { display: flex; flex-direction: column; min-height: 0; }
    .state-panel { flex: 1 1 44%; }
    .questions-panel { flex: 1 1 56%; }
    .response-panel { display: flex; flex-direction: column; min-height: 0; height: 100%; }

    .panel-heading {
      min-height: 48px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .panel-heading h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 650;
    }

    .panel-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .heading-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

    .panel-body { padding: 14px; min-width: 0; }
    .editor-panel .panel-body { display: flex; flex-direction: column; min-height: 0; flex: 1; }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      padding: 11px 12px;
      color: #19202a;
      background: #fcfdff;
      outline: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.55;
      tab-size: 2;
    }

    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(38, 103, 223, .12); }
    #stateEditor { min-height: 174px; flex: 1; }
    #questionsEditor { min-height: 245px; flex: 1; }
    #responseJson { min-height: 420px; flex: 1; }

    .editor-toolbar, .response-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .hint { color: var(--muted); font-size: 14px; }

    .button {
      appearance: none;
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      padding: 7px 11px;
      min-height: 34px;
      background: #fff;
      color: var(--text);
      font-size: 12px;
      transition: background .15s, border-color .15s, color .15s;
    }

    .button:hover { background: #f5f7fa; border-color: #aeb7c3; }
    .button:focus-visible { outline: 2px solid rgba(38, 103, 223, .4); outline-offset: 1px; }
    .button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 650; }
    .button.primary:hover { background: #1e56c1; border-color: #1e56c1; }
    .button.subtle { padding: 5px 8px; min-height: 29px; color: #415064; }
    .button[disabled] { cursor: wait; opacity: .65; }

    .select-wrap { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    select {
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      background: #fff;
      color: var(--text);
      min-height: 32px;
      padding: 5px 8px;
      outline: none;
      font-size: 12px;
    }
    select:focus { border-color: var(--accent); }

    .response-panel .panel-body { display: flex; flex-direction: column; min-height: 0; flex: 1; }
    .response-toolbar { margin-top: 0; margin-bottom: 12px; }
    .view-toggle {
      display: inline-flex;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f5f6f8;
    }
    .view-toggle button {
      border: 0;
      border-radius: 4px;
      padding: 5px 10px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
    }
    .view-toggle button.active { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(28, 38, 52, .12); }

    .response-status {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 26px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .response-status.error { color: var(--danger); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #aeb7c3; }
    .status-dot.ready { background: #4c9a6a; }
    .status-dot.busy { background: #d19a2c; }
    .status-dot.error { background: var(--danger); }

    [hidden] { display: none !important; }
    .view { min-height: 0; flex: 1; }
    .json-view { display: flex; flex-direction: column; }
    .json-view textarea { flex: 1; }
    .chart-view { overflow: auto; padding: 4px 2px 8px; }
    .chart-empty {
      height: 100%;
      min-height: 300px;
      display: grid;
      place-items: center;
      color: var(--muted);
      border: 1px dashed var(--border-strong);
      border-radius: 6px;
      padding: 20px;
      text-align: center;
    }

    .answer-card {
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fcfdff;
    }
    .answer-card:last-child { margin-bottom: 0; }
    .answer-title { margin: 0 0 8px; font-weight: 650; font-size: 13px; overflow-wrap: anywhere; }
    .answer-meta { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
    .bar-row { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(120px, 2.4fr) 48px; align-items: center; gap: 8px; margin: 7px 0; }
    .bar-label { color: #4b5563; font-size: 14px; overflow-wrap: anywhere; }
    .bar-track { height: 8px; background: #e8ecf1; border-radius: 99px; overflow: hidden; }
    .bar-fill { display: block; height: 100%; background: #5887df; border-radius: inherit; }
    .bar-value { color: #4b5563; text-align: right; font-family: ui-monospace, monospace; font-size: 14px; }
    .scalar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 7px; }
    .scalar { padding: 7px 8px; border: 1px solid var(--border); border-radius: 4px; background: #fff; }
    .scalar-label { display: block; color: var(--muted); font-size: 12px; }
    .scalar-value { display: block; margin-top: 2px; font-family: ui-monospace, monospace; font-size: 12px; overflow-wrap: anywhere; }
    .uncalibrated { margin-top: 10px; color: var(--muted); font-size: 12px; }

    .app-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 1px;
    }
    .model-line { color: var(--muted); font-size: 12px; }
    .model-line strong { color: var(--text); font-weight: 600; }
    .footer-actions { display: flex; align-items: center; gap: 12px; }
    .run-button { min-width: 104px; }
    .shortcut { color: var(--muted); font-size: 14px; }

    @media (max-width: 820px) {
      .app-shell { padding: 15px; }
      .workspace { grid-template-columns: 1fr; }
      .state-panel, .questions-panel { flex: none; }
      #stateEditor { min-height: 190px; }
      #questionsEditor { min-height: 265px; }
      .response-panel { min-height: 560px; }
      .header-note { display: none; }
    }

    @media (max-width: 480px) {
      .app-header { display: block; }
      .app-footer { align-items: flex-start; flex-direction: column; }
      .footer-actions { width: 100%; justify-content: space-between; }
      .bar-row { grid-template-columns: minmax(90px, 1fr) minmax(80px, 1.4fr) 44px; gap: 6px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Local evaluator</p>
        <h1>Decision playground</h1>
      </div>
      <div class="header-note">State と Questions を編集して評価を実行</div>
    </header>

    <section class="workspace" aria-label="Evaluation playground">
      <div class="column">
        <section class="panel editor-panel state-panel" aria-labelledby="stateHeading">
          <div class="panel-heading">
            <div>
              <h2 id="stateHeading">State</h2>
              <p>モデルに渡す現在の状態（任意）</p>
            </div>
            <div class="heading-actions">
              <div class="view-toggle" role="group" aria-label="State format">
                <button type="button" data-state-mode="plain" class="active">Plain</button>
                <button type="button" data-state-mode="json">JSON</button>
              </div>
              <button class="button subtle" id="stateSampleButton" type="button">サンプル</button>
            </div>
          </div>
          <div class="panel-body">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <label class="button subtle">画像を添付 <input id="stateImageInput" type="file" accept="image/png,image/jpeg,image/webp" style="max-width:220px" aria-label="State画像"></label>
              <span id="imageName" class="hint">PNG / JPEG / WebP · 5MBまで</span>
              <button id="removeImage" class="button subtle" type="button" hidden>画像を外す</button>
              <img id="imagePreview" alt="Stateの添付画像" hidden style="max-width:140px;max-height:90px;object-fit:contain">
            </div>
            <textarea id="stateEditor" spellcheck="false" aria-label="State JSON"></textarea>
            <div class="editor-toolbar">
              <div class="toolbar-group">
                <button class="button subtle" id="stateFormatButton" type="button">Format JSON</button>
                <span class="hint">JSON または plain string</span>
              </div>
              <span class="hint">⌘/Ctrl + Enter で実行</span>
            </div>
          </div>
        </section>

        <section class="panel editor-panel questions-panel" aria-labelledby="questionsHeading">
          <div class="panel-heading">
            <div>
              <h2 id="questionsHeading">Questions</h2>
              <p>評価する問いと選択肢</p>
            </div>
            <button class="button subtle" id="questionsSampleButton" type="button">サンプル</button>
          </div>
          <div class="panel-body">
            <textarea id="questionsEditor" spellcheck="false" aria-label="Questions JSON"></textarea>
            <div class="editor-toolbar">
              <div class="toolbar-group">
                <span class="select-wrap">
                  <label for="questionType">追加:</label>
                  <select id="questionType" aria-label="Question type">
                    <option value="choice">choice</option>
                    <option value="noul">noul</option>
                    <option value="score">score</option>
                  </select>
                </span>
                <button class="button subtle" id="addQuestionButton" type="button">＋ question</button>
              </div>
              <button class="button subtle" id="questionsFormatButton" type="button">Format Questions JSON</button>
            </div>
          </div>
        </section>
      </div>

      <section class="panel response-panel" aria-labelledby="responseHeading">
        <div class="panel-heading">
          <div>
            <h2 id="responseHeading">Response</h2>
            <p id="responseSummary">実行結果がここに表示されます</p>
          </div>
          <div class="view-toggle" role="group" aria-label="Response view">
            <button type="button" data-view="json" class="active">JSON</button>
            <button type="button" data-view="chart">Probabilities</button>
          </div>
        </div>
        <div class="panel-body">
          <div id="responseStatus" class="response-status" aria-live="polite">
            <span class="status-dot"></span>
            <span>未実行</span>
          </div>
          <div id="jsonView" class="view json-view">
            <textarea id="responseJson" readonly spellcheck="false" aria-label="Response JSON">{
  "message": "Run を押すとレスポンスが表示されます"
}</textarea>
          </div>
          <div id="chartView" class="view chart-view" hidden>
            <div class="chart-empty">まだ評価結果がありません。<br>Run を押して回答の確率を表示します。</div>
          </div>
        </div>
      </section>
    </section>

    <footer class="app-footer">
      <div class="model-line"><label for="modelSelect">Model </label><select id="modelSelect" aria-label="Model" disabled><option value="">Loading…</option></select></div>
      <div class="footer-actions">
        <button class="button subtle" id="clearButton" type="button">Clear</button>
        <button class="button primary run-button" id="runButton" type="button">Run</button>
      </div>
    </footer>
  </main>

  <script>
    (() => {
      const samples = {
        state: {
          direction: '常に前を向いてください。1歩下がって。5歩左へ行って。2歩下がって。3歩前進して。2歩、いや3歩右に進んで。'
        },
        questions: {
          taste: {
            type: 'choice',
            instructions: '最終的な位置はどこですか？',
            criteria: {
              '戻っている': '',
              '左に2歩の位置': '',
              '右に2歩の位置': '',
              '前に2歩の位置': '',
              '後ろに2歩の位置': ''
            }
          }
        }
      };

      const stateEditor = document.getElementById('stateEditor');
      const questionsEditor = document.getElementById('questionsEditor');
      const responseJson = document.getElementById('responseJson');
      const responseStatus = document.getElementById('responseStatus');
      const responseSummary = document.getElementById('responseSummary');
      const runButton = document.getElementById('runButton');
      const modelSelect = document.getElementById('modelSelect');
      const chartView = document.getElementById('chartView');
      const jsonView = document.getElementById('jsonView');
      const questionType = document.getElementById('questionType');
      let stateMode = 'plain';
      let stateImage;
      const imageInput = document.getElementById('stateImageInput');
      function clearImage() {
        stateImage = undefined; imageInput.value = '';
        document.getElementById('imagePreview').hidden = true;
        document.getElementById('imagePreview').removeAttribute('src');
        document.getElementById('removeImage').hidden = true;
        document.getElementById('imageName').textContent = 'PNG / JPEG / WebP · 5MBまで';
      }
      imageInput.addEventListener('change', async () => {
        const file = imageInput.files[0];
        clearImage();
        if (!file) return;
        if (!['image/png','image/jpeg','image/webp'].includes(file.type) || file.size > 5*1024*1024) {
          setStatus('PNG・JPEG・WebP、5MB以内の画像を選んでください', 'error'); return;
        }
        runButton.disabled = true;
        try {
          stateImage = await new Promise((resolve,reject) => {
            const reader = new FileReader(); reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(new Error('画像を読み込めませんでした')); reader.readAsDataURL(file);
          });
          document.getElementById('imagePreview').src = stateImage;
          document.getElementById('imagePreview').hidden = false;
          document.getElementById('removeImage').hidden = false;
          document.getElementById('imageName').textContent = file.name;
        } catch(e) { clearImage(); setStatus(e.message,'error'); }
        finally { runButton.disabled = false; }
      });
      document.getElementById('removeImage').addEventListener('click', clearImage);

      const pretty = (value) => JSON.stringify(value, null, 2);
      const setSamples = () => {
        stateMode = 'json';
        document.querySelectorAll('[data-state-mode]').forEach((button) => button.classList.toggle('active', button.dataset.stateMode === stateMode));
        stateEditor.value = pretty(samples.state);
        questionsEditor.value = pretty(samples.questions);
      };
      setSamples();

      fetch('/api/models').then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      }).then(({ models, default: defaultModel }) => {
        modelSelect.replaceChildren(...models.map((model) => new Option(model, model)));
        modelSelect.value = defaultModel;
        modelSelect.disabled = false;
      }).catch(() => {
        modelSelect.replaceChildren(new Option('Configuration error', ''));
      });

      function readState() {
        const raw = stateEditor.value.trim();
        if (!raw) return undefined;
        if (stateMode === 'plain') return raw;
        try { return JSON.parse(raw); } catch (_) { throw new Error('State は JSON mode では有効な JSON にしてください。'); }
      }

      function readQuestions() {
        const raw = questionsEditor.value.trim();
        if (!raw) throw new Error('Questions を入力してください。');
        let parsed;
        try { parsed = JSON.parse(raw); } catch (_) { throw new Error('Questions は有効な JSON object にしてください。'); }
        if (!parsed || Array.isArray(parsed) || typeof parsed !== 'object') {
          throw new Error('Questions は question key を持つ JSON object にしてください。');
        }
        return parsed;
      }

      function setStatus(message, kind = '') {
        responseStatus.className = `response-status${kind ? ` ${kind}` : ''}`;
        responseStatus.innerHTML = `<span class="status-dot ${kind || 'ready'}"></span><span></span>`;
        responseStatus.lastElementChild.textContent = message;
      }

      function formatJson(textarea) {
        const parsed = JSON.parse(textarea.value);
        textarea.value = pretty(parsed);
      }

      function setStateMode(nextMode) {
        if (nextMode === stateMode) return;
        const raw = stateEditor.value;
        if (nextMode === 'json') {
          try { stateEditor.value = pretty(JSON.parse(raw)); }
          catch (_) { stateEditor.value = pretty(raw); }
        } else {
          try {
            const parsed = JSON.parse(raw);
            if (typeof parsed === 'string') stateEditor.value = parsed;
          } catch (_) { /* Keep the editable plain text as-is. */ }
        }
        stateMode = nextMode;
        document.querySelectorAll('[data-state-mode]').forEach((button) => button.classList.toggle('active', button.dataset.stateMode === stateMode));
        stateEditor.setAttribute('aria-label', stateMode === 'json' ? 'State JSON' : 'State plain text');
      }

      function criteriaFor(question) {
        if (!question || typeof question !== 'object') return [];
        const raw = question.criteria || question.choices || question.options || [];
        if (Array.isArray(raw)) {
          return raw.map((item, index) => ({ item, index })).filter(({ item }) => item !== null && item !== undefined);
        }
        if (raw && typeof raw === 'object') {
          return Object.entries(raw).map(([key, value], index) => ({ item: value, key, index }));
        }
        return [];
      }

      function criterionLabel(entry) {
        const { item, key, index } = entry;
        if (key !== undefined) return key;
        if (typeof item === 'string' || typeof item === 'number' || typeof item === 'boolean') return String(item);
        if (item && typeof item === 'object') {
          const named = item.label ?? item.name ?? item.title ?? item.text ?? item.description;
          if (named !== undefined && typeof named !== 'object') return String(named);
          try { return JSON.stringify(item); } catch (_) { return `criterion ${index + 1}`; }
        }
        return `criterion ${index + 1}`;
      }

      function criterionDescription(entry) {
        const { item } = entry;
        if (item && typeof item === 'object' && item.description !== undefined) return scalar(item.description);
        if (entry.key !== undefined && (typeof item === 'string' || typeof item === 'number' || typeof item === 'boolean')) return String(item);
        return criterionLabel(entry);
      }

      function scalar(value) {
        if (value === null || value === undefined) return 'null';
        if (typeof value === 'object') return JSON.stringify(value);
        return String(value);
      }

      function renderChart(payload, questions) {
        chartView.innerHTML = '';
        const answers = payload && payload.answers;
        if (!answers || typeof answers !== 'object' || !Object.keys(answers).length) {
          chartView.innerHTML = '<div class="chart-empty">回答の確率データがありません。</div>';
          return;
        }
        Object.entries(answers).forEach(([key, answer]) => {
          const card = document.createElement('article');
          card.className = 'answer-card';
          const title = document.createElement('h3');
          title.className = 'answer-title';
          title.textContent = key;
          card.appendChild(title);
          const meta = document.createElement('p');
          meta.className = 'answer-meta';
          meta.textContent = answer && answer.type ? `type: ${answer.type}` : 'answer';
          card.appendChild(meta);

          const question = questions && questions[key];
          const type = answer && answer.type ? answer.type : (question && question.type);
          const criteria = criteriaFor(question);
          let probabilities = answer && answer.probabilities;
          if (type === 'noul') {
            const numericYes = answer && [answer.noul, answer.probability, answer.yes_probability]
              .find((value) => typeof value === 'number' && Number.isFinite(value));
            if (numericYes !== undefined) {
              let yes = Number(numericYes);
              if (yes > 1) yes /= 100;
              probabilities = { true: yes, false: 1 - yes };
            }
            if ((!probabilities || typeof probabilities !== 'object') && answer && answer.choice !== undefined) {
              const yes = answer.choice === true || answer.choice === 'true' || answer.choice === 'yes';
              probabilities = { true: yes ? 1 : 0, false: yes ? 0 : 1 };
            }
          }
          if (probabilities && typeof probabilities === 'object' && !Array.isArray(probabilities)) {
            Object.entries(probabilities).forEach(([keyOrLabel, rawValue]) => {
              let label = keyOrLabel;
              if (type === 'score' && /^\d+$/.test(keyOrLabel)) {
                const entry = criteria[Number(keyOrLabel)];
                label = entry ? criterionDescription(entry) : keyOrLabel;
              } else if (type === 'choice' && /^\d+$/.test(keyOrLabel)) {
                const entry = criteria[Number(keyOrLabel)];
                label = entry ? criterionLabel(entry) : keyOrLabel;
              } else if (type === 'noul' && (keyOrLabel === 'true' || keyOrLabel === 'false')) {
                const entry = criteria.find((candidate) => candidate.key === keyOrLabel);
                label = entry ? criterionDescription(entry) : keyOrLabel === 'true' ? 'Yes' : 'No';
              }
              let number = Number(rawValue);
              if (!Number.isFinite(number)) number = 0;
              if (number > 1) number /= 100;
              const row = document.createElement('div');
              row.className = 'bar-row';
              const labelNode = document.createElement('span');
              labelNode.className = 'bar-label';
              labelNode.textContent = label;
              const track = document.createElement('span');
              track.className = 'bar-track';
              const fill = document.createElement('span');
              fill.className = 'bar-fill';
              fill.style.width = `${Math.max(0, Math.min(100, number * 100))}%`;
              track.appendChild(fill);
              const valueNode = document.createElement('span');
              valueNode.className = 'bar-value';
              valueNode.textContent = `${(number * 100).toFixed(1)}%`;
              row.append(labelNode, track, valueNode);
              card.appendChild(row);
            });
            const note = document.createElement('div');
            note.className = 'uncalibrated';
            note.textContent = type === 'noul'
              ? 'Yes の相対確率（未校正）'
              : '候補内の相対確率（未校正）';
            card.appendChild(note);
          }

          const scalarKeys = type === 'noul' ? ['noul'] : ['choice', 'score', 'confidence'];
          const scalarValues = scalarKeys.filter((field) => answer && Object.prototype.hasOwnProperty.call(answer, field));
          if (scalarValues.length) {
            const grid = document.createElement('div');
            grid.className = 'scalar-grid';
            scalarValues.forEach((field) => {
              const item = document.createElement('div');
              item.className = 'scalar';
              const label = document.createElement('span');
              label.className = 'scalar-label';
              label.textContent = field === 'confidence' ? 'confidence（集中度）' : field;
              const value = document.createElement('span');
              value.className = 'scalar-value';
              value.textContent = field === 'confidence' && typeof answer[field] === 'number'
                ? `${(answer[field] * 100).toFixed(1)}%`
                : scalar(answer[field]);
              item.append(label, value);
              grid.appendChild(item);
            });
            card.appendChild(grid);
          }
          chartView.appendChild(card);
        });
      }

      async function runEvaluation() {
        let state;
        let questions;
        try {
          state = readState();
          questions = readQuestions();
        } catch (error) {
          setStatus(error.message, 'error');
          responseSummary.textContent = '入力エラー';
          responseJson.value = pretty({ error: error.message });
          return;
        }

        runButton.disabled = true;
        runButton.textContent = 'Running…';
        setStatus('評価中…', 'busy');
        responseSummary.textContent = 'リクエスト送信中';
        try {
          const response = await fetch('/api/evaluate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ state, state_image: stateImage, questions, model: modelSelect.value || undefined })
          });
          const raw = await response.text();
          let payload;
          try { payload = raw ? JSON.parse(raw) : {}; } catch (_) { payload = { raw }; }
          if (!response.ok) {
            const detail = payload && (payload.error || payload.message) ? (payload.error || payload.message) : `HTTP ${response.status}`;
            throw new Error(detail);
          }
          responseJson.value = pretty(payload);
          renderChart(payload, questions);
          const timing = payload && payload.evaluation_time_ms != null ? ` · ${payload.evaluation_time_ms} ms` : '';
          const model = payload && payload.model ? ` · ${payload.model}` : '';
          responseSummary.textContent = `評価完了${model}${timing}`;
          setStatus('完了', 'ready');
        } catch (error) {
          responseSummary.textContent = 'リクエストエラー';
          responseJson.value = pretty({ error: error.message || '評価に失敗しました。' });
          chartView.innerHTML = '<div class="chart-empty">評価結果を表示できませんでした。</div>';
          setStatus(error.message || '評価に失敗しました。', 'error');
        } finally {
          runButton.disabled = false;
          runButton.textContent = 'Run';
        }
      }

      document.getElementById('stateSampleButton').addEventListener('click', () => {
        stateMode = 'json';
        document.querySelectorAll('[data-state-mode]').forEach((button) => button.classList.toggle('active', button.dataset.stateMode === stateMode));
        stateEditor.value = pretty(samples.state);
        stateEditor.setAttribute('aria-label', 'State JSON');
      });
      document.getElementById('questionsSampleButton').addEventListener('click', () => { questionsEditor.value = pretty(samples.questions); });
      document.querySelectorAll('[data-state-mode]').forEach((button) => {
        button.addEventListener('click', () => setStateMode(button.dataset.stateMode));
      });
      document.getElementById('stateFormatButton').addEventListener('click', () => {
        try {
          if (stateMode !== 'json') throw new Error('JSON mode に切り替えてください。');
          formatJson(stateEditor);
          setStatus('State を整形しました。', 'ready');
        } catch (error) { setStatus(error.message || 'State は JSON ではないため整形できません。', 'error'); }
      });
      document.getElementById('addQuestionButton').addEventListener('click', () => {
        try {
          const questions = readQuestions();
          const base = `question_${Object.keys(questions).length + 1}`;
          const type = questionType.value;
          questions[base] = type === 'choice'
            ? { type, instructions: '質問を入力してください', criteria: { '選択肢A': '', '選択肢B': '' } }
            : type === 'score'
              ? { type, instructions: 'スコアを入力してください', criteria: ['低い', 'やや低い', '普通', 'やや高い', '高い'] }
              : { type, instructions: '質問を入力してください', criteria: { true: 'はい', false: 'いいえ' } };
          questionsEditor.value = pretty(questions);
          setStatus(`${base} を追加しました。`, 'ready');
        } catch (error) { setStatus(error.message, 'error'); }
      });
      document.querySelectorAll('[data-view]').forEach((button) => {
        button.addEventListener('click', () => {
          const isChart = button.dataset.view === 'chart';
          document.querySelectorAll('[data-view]').forEach((item) => item.classList.toggle('active', item === button));
          jsonView.hidden = isChart;
          chartView.hidden = !isChart;
        });
      });
      document.getElementById('questionsFormatButton').addEventListener('click', () => {
        try { formatJson(questionsEditor); } catch(e) { setStatus(e.message, 'error'); }
      });
      document.getElementById('clearButton').addEventListener('click', () => {
        clearImage(); stateEditor.value = '{}'; questionsEditor.value = '{}'; responseJson.value = '{}';
        chartView.replaceChildren(); responseSummary.textContent = '実行結果がここに表示されます'; setStatus('未実行');
      });
      runButton.addEventListener('click', runEvaluation);
      [stateEditor, questionsEditor].forEach((editor) => editor.addEventListener('keydown', (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
          event.preventDefault();
          runEvaluation();
        }
      }));
    })();
  </script>
</body>
</html>
